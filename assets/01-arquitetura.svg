<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Arquitetura do MVP (tudo local)</text>

  <!-- Camera -->
  <rect x="30" y="120" width="150" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Câmera IP</text>
  <text x="105" y="174" text-anchor="middle" font-size="12" fill="#1e3a8a">stream RTSP</text>
  <text x="105" y="192" text-anchor="middle" font-size="12" fill="#1e3a8a">sem nuvem do fabricante</text>

  <!-- Button -->
  <rect x="30" y="330" width="150" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="105" y="362" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">Botão (ESP32)</text>
  <text x="105" y="384" text-anchor="middle" font-size="12" fill="#78350f">envia sinal por Wi-Fi</text>
  <text x="105" y="402" text-anchor="middle" font-size="12" fill="#78350f">com segredo + cooldown</text>

  <!-- Server -->
  <rect x="270" y="60" width="360" height="430" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="450" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Servidor local (Docker)</text>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#4b5563">notebook velho ou Raspberry Pi</text>

  <rect x="295" y="120" width="310" height="115" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">recorder</text>
  <text x="450" y="168" text-anchor="middle" font-size="12" fill="#14532d">FFmpeg grava em segmentos (-c copy)</text>
  <text x="450" y="186" text-anchor="middle" font-size="12" fill="#14532d">buffer circular na RAM (tmpfs)</text>
  <text x="450" y="204" text-anchor="middle" font-size="12" fill="#14532d">recebe o botão e corta os últimos 30 s</text>
  <text x="450" y="222" text-anchor="middle" font-size="12" fill="#14532d">sem porta aberta para os celulares</text>

  <rect x="295" y="265" width="310" height="70" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="291" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">Pasta de clips (volume)</text>
  <text x="450" y="311" text-anchor="middle" font-size="12" fill="#312e81">nome = token aleatório · expira em 1-2 h</text>

  <rect x="295" y="365" width="310" height="105" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="391" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">web (somente leitura)</text>
  <text x="450" y="413" text-anchor="middle" font-size="12" fill="#7c2d12">GET /c/token → página + vídeo</text>
  <text x="450" y="431" text-anchor="middle" font-size="12" fill="#7c2d12">sem upload, sem painel, sem listagem</text>
  <text x="450" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">única porta exposta aos celulares</text>

  <!-- TV -->
  <rect x="720" y="120" width="150" height="100" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="795" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#831843">TV</text>
  <text x="795" y="174" text-anchor="middle" font-size="12" fill="#831843">Chromium em modo kiosk</text>
  <text x="795" y="192" text-anchor="middle" font-size="12" fill="#831843">mostra o QR code</text>
  <text x="795" y="210" text-anchor="middle" font-size="12" fill="#831843">sem teclado nem mouse</text>

  <!-- Phone -->
  <rect x="720" y="360" width="150" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="795" y="392" text-anchor="middle" font-size="16" font-weight="bold" fill="#0c4a6e">Celular</text>
  <text x="795" y="414" text-anchor="middle" font-size="12" fill="#0c4a6e">escaneia o QR,</text>
  <text x="795" y="432" text-anchor="middle" font-size="12" fill="#0c4a6e">assiste e baixa o clip</text>

  <!-- Arrows -->
  <line x1="180" y1="165" x2="293" y2="165" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="236" y="156" text-anchor="middle" font-size="11" fill="#374151">RTSP</text>

  <polyline points="180,380 235,380 235,205 293,205" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="215" y="372" text-anchor="end" font-size="11" fill="#374151">Wi-Fi</text>

  <line x1="450" y1="235" x2="450" y2="263" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="335" x2="450" y2="363" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="462" y="354" font-size="11" fill="#374151">lê (ro)</text>

  <line x1="605" y1="170" x2="718" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="662" y="160" text-anchor="middle" font-size="11" fill="#374151">HDMI</text>

  <line x1="718" y1="415" x2="607" y2="415" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="662" y="405" text-anchor="middle" font-size="11" fill="#374151">Wi-Fi do local</text>
</svg>
