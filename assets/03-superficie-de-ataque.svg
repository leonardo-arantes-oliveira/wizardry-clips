<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Superfície de ataque: o que fica fechado e o que fica aberto</text>

  <!-- Closed zone -->
  <rect x="20" y="60" width="500" height="320" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">FECHADO (ninguém na rede alcança)</text>

  <rect x="40" y="105" width="225" height="62" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="152" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Câmera</text>
  <text x="152" y="150" text-anchor="middle" font-size="11" fill="#14532d">senha trocada, sem internet</text>

  <rect x="275" y="105" width="225" height="62" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="387" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Recorder + FFmpeg</text>
  <text x="387" y="150" text-anchor="middle" font-size="11" fill="#14532d">sem porta para os celulares</text>

  <rect x="40" y="180" width="225" height="62" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="152" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Buffer de vídeo</text>
  <text x="152" y="225" text-anchor="middle" font-size="11" fill="#14532d">só na RAM, apagado sozinho</text>

  <rect x="275" y="180" width="225" height="62" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="387" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Página da TV</text>
  <text x="387" y="225" text-anchor="middle" font-size="11" fill="#14532d">só em 127.0.0.1, sem teclado</text>

  <rect x="40" y="255" width="225" height="62" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="152" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Administração (SSH)</text>
  <text x="152" y="300" text-anchor="middle" font-size="11" fill="#14532d">só por chave, só rede interna</text>

  <rect x="275" y="255" width="225" height="62" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="387" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Caixa trancada</text>
  <text x="387" y="300" text-anchor="middle" font-size="11" fill="#14532d">sem acesso físico a portas USB</text>

  <text x="270" y="355" text-anchor="middle" font-size="12" fill="#14532d">Containers: não-root, sistema de arquivos somente leitura, sem privilégios extras</text>

  <!-- Open zone -->
  <rect x="540" y="60" width="340" height="320" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="710" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">ABERTO (a superfície real)</text>

  <rect x="560" y="105" width="300" height="115" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="710" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">1) Porta do site de download</text>
  <text x="710" y="152" text-anchor="middle" font-size="11" fill="#7c2d12">só responde GET /c/token</text>
  <text x="710" y="170" text-anchor="middle" font-size="11" fill="#7c2d12">token aleatório longo, 404 se não bater</text>
  <text x="710" y="188" text-anchor="middle" font-size="11" fill="#7c2d12">sem upload, sem login, sem listagem</text>
  <text x="710" y="206" text-anchor="middle" font-size="11" fill="#7c2d12">limite de requisições</text>

  <rect x="560" y="235" width="300" height="115" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="710" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">2) Endpoint do botão</text>
  <text x="710" y="282" text-anchor="middle" font-size="11" fill="#7c2d12">escuta só na interface interna</text>
  <text x="710" y="300" text-anchor="middle" font-size="11" fill="#7c2d12">exige segredo longo</text>
  <text x="710" y="318" text-anchor="middle" font-size="11" fill="#7c2d12">cooldown entre cliques</text>
  <text x="710" y="336" text-anchor="middle" font-size="11" fill="#7c2d12">ignora qualquer dado de entrada</text>

  <!-- Bottom summary -->
  <rect x="20" y="395" width="860" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Pior caso aceitável: alguém assistir a alguns clips curtos de quadra, ou o serviço ficar lento.</text>
  <text x="450" y="445" text-anchor="middle" font-size="12" fill="#312e81">Mesmo se o servidor web for explorado, ele só lê uma pasta; não grava, não vê a câmera, não roda o FFmpeg.</text>
</svg>
