<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="270" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Do clique ao download</text>

  <!-- Step boxes: x = 11 + i*150, width 128 -->
  <g>
    <rect x="11" y="70" width="128" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="75" cy="70" r="16" fill="#d97706"/><text x="75" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
    <text x="75" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">Jogadaço!</text>
    <text x="75" y="140" text-anchor="middle" font-size="12" fill="#78350f">O jogador corre</text>
    <text x="75" y="157" text-anchor="middle" font-size="12" fill="#78350f">e aperta o</text>
    <text x="75" y="174" text-anchor="middle" font-size="12" fill="#78350f">botão no totem</text>
  </g>
  <g>
    <rect x="161" y="70" width="128" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="225" cy="70" r="16" fill="#d97706"/><text x="225" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
    <text x="225" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">ESP32 avisa</text>
    <text x="225" y="140" text-anchor="middle" font-size="12" fill="#78350f">Manda o sinal</text>
    <text x="225" y="157" text-anchor="middle" font-size="12" fill="#78350f">com segredo pelo</text>
    <text x="225" y="174" text-anchor="middle" font-size="12" fill="#78350f">Wi-Fi local</text>
  </g>
  <g>
    <rect x="311" y="70" width="128" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="375" cy="70" r="16" fill="#16a34a"/><text x="375" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
    <text x="375" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Servidor corta</text>
    <text x="375" y="140" text-anchor="middle" font-size="12" fill="#14532d">Junta os últimos</text>
    <text x="375" y="157" text-anchor="middle" font-size="12" fill="#14532d">30 s do buffer</text>
    <text x="375" y="174" text-anchor="middle" font-size="12" fill="#14532d">(sem recodificar)</text>
  </g>
  <g>
    <rect x="461" y="70" width="128" height="150" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="525" cy="70" r="16" fill="#4f46e5"/><text x="525" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
    <text x="525" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Clip pronto</text>
    <text x="525" y="140" text-anchor="middle" font-size="12" fill="#312e81">Salvo como MP4</text>
    <text x="525" y="157" text-anchor="middle" font-size="12" fill="#312e81">com token aleatório</text>
    <text x="525" y="174" text-anchor="middle" font-size="12" fill="#312e81">e prazo para expirar</text>
  </g>
  <g>
    <rect x="611" y="70" width="128" height="150" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <circle cx="675" cy="70" r="16" fill="#db2777"/><text x="675" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">5</text>
    <text x="675" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#831843">TV mostra o QR</text>
    <text x="675" y="140" text-anchor="middle" font-size="12" fill="#831843">A página da TV</text>
    <text x="675" y="157" text-anchor="middle" font-size="12" fill="#831843">atualiza sozinha</text>
    <text x="675" y="174" text-anchor="middle" font-size="12" fill="#831843">com o novo QR</text>
  </g>
  <g>
    <rect x="761" y="70" width="128" height="150" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <circle cx="825" cy="70" r="16" fill="#0284c7"/><text x="825" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">6</text>
    <text x="825" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">Celular baixa</text>
    <text x="825" y="140" text-anchor="middle" font-size="12" fill="#0c4a6e">Escaneia o QR,</text>
    <text x="825" y="157" text-anchor="middle" font-size="12" fill="#0c4a6e">assiste e baixa</text>
    <text x="825" y="174" text-anchor="middle" font-size="12" fill="#0c4a6e">o highlight</text>
  </g>

  <line x1="139" y1="145" x2="159" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="289" y1="145" x2="309" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="439" y1="145" x2="459" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="589" y1="145" x2="609" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="739" y1="145" x2="759" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <text x="450" y="255" text-anchor="middle" font-size="13" fill="#4b5563">Tempo alvo do clique até o QR aparecer: poucos segundos (a medir no protótipo)</text>
</svg>
